AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Uno model cache: downloads HuggingFace models to a persistent S3 bucket
  for fast retrieval by training and eval instances in the same region.
  Deploy with launch-prefetch-models.sh; re-deploy with new Models to add
  more models to the same bucket.

Parameters:
  BucketName:
    Type: String
    Description: >-
      Name of the S3 bucket to store cached models. Must be globally unique.
      Use the same value on every deploy to accumulate models in one bucket.

  Models:
    Type: String
    Description: >-
      Comma-separated list of HuggingFace model IDs to pre-fetch.
      Example: unsloth/Qwen3.5-4B,unsloth/Qwen3.5-0.8B

  InstanceType:
    Type: String
    Default: c5n.xlarge
    Description: >-
      EC2 instance type. Only CPU is needed (no GPU); c5n instances have
      high network throughput for fast downloads from HuggingFace.

  HfTokenSsmPath:
    Type: String
    Default: /pkna-uno/hf-token
    Description: >-
      SSM SecureString parameter path containing the HuggingFace token.
      The token is fetched at runtime, never stored in the template.

  GitRepo:
    Type: String
    Default: https://github.com/mbrt/pkna-uno.git
    Description: Git repository URL.

  GitRef:
    Type: String
    Default: main
    Description: Git branch or tag to checkout.

Resources:
  ModelsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName

  PrefetchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: PrefetchPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3Upload
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ModelsBucket.Arn
                  - !Sub "${ModelsBucket.Arn}/*"
              - Sid: ReadHfToken
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${HfTokenSsmPath}"
              - Sid: SelfTerminate
                Effect: Allow
                Action:
                  - ec2:TerminateInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/aws:cloudformation:stack-id": !Ref AWS::StackId

  PrefetchInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref PrefetchRole

  PrefetchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} - no inbound, all outbound"

  PrefetchInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref PrefetchInstanceProfile
      SecurityGroupIds:
        - !GetAtt PrefetchSecurityGroup.GroupId
      ImageId: "{{resolve:ssm:/aws/service/deeplearning/ami/x86_64/oss-nvidia-driver-gpu-pytorch-2.8-ubuntu-24.04/latest/ami-id}}"
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 200
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-prefetch"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail

          # ---------------------------------------------------------------
          # Configuration from CloudFormation parameters
          # ---------------------------------------------------------------
          S3_BUCKET="${BucketName}"
          REGION="${AWS::Region}"
          MODELS="${Models}"

          WORK_DIR="/home/ubuntu/prefetch"
          LOG_FILE="/home/ubuntu/prefetch.log"
          IMDS_TOKEN=$(curl -sf -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
          INSTANCE_ID=$(curl -sf -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/instance-id)

          # ---------------------------------------------------------------
          # Cleanup trap: upload logs and self-terminate on exit
          # ---------------------------------------------------------------
          cleanup() {
            local exit_code=$?
            echo "=== Cleanup (exit_code=$exit_code) ==="
            aws s3 cp "$LOG_FILE" "s3://$S3_BUCKET/logs/prefetch.log" --region "$REGION" || true
            aws s3 cp /var/log/cloud-init-output.log "s3://$S3_BUCKET/logs/cloud-init-output.log" --region "$REGION" || true
            aws ec2 terminate-instances --instance-ids "$INSTANCE_ID" --region "$REGION" || true
          }
          trap cleanup EXIT

          # ---------------------------------------------------------------
          # All output to log file (and console for cloud-init)
          # ---------------------------------------------------------------
          exec > >(tee -a "$LOG_FILE") 2>&1
          echo "=== Prefetch started at $(date -u) ==="
          echo "Instance: $INSTANCE_ID  Region: $REGION"
          echo "Models: $MODELS"

          # ---------------------------------------------------------------
          # Clone repo as ubuntu
          # ---------------------------------------------------------------
          echo "=== Cloning ${GitRepo} @ ${GitRef} ==="
          sudo -u ubuntu git clone --depth 1 --branch "${GitRef}" "${GitRepo}" "$WORK_DIR"

          # ---------------------------------------------------------------
          # Run prefetch script as ubuntu
          # ---------------------------------------------------------------
          echo "=== Handing off to infra/aws_prefetch_models.sh ==="
          sudo -u ubuntu \
            MODELS="$MODELS" \
            S3_BUCKET="$S3_BUCKET" \
            REGION="$REGION" \
            HF_TOKEN_SSM_PATH="${HfTokenSsmPath}" \
            HOME=/home/ubuntu \
            PATH="/usr/local/bin:/usr/bin:/bin" \
            bash -c 'cd "$0" && exec ./infra/aws_prefetch_models.sh' "$WORK_DIR"

          echo "=== Prefetch script finished ==="

Outputs:
  BucketName:
    Description: S3 bucket where models are cached
    Value: !Ref ModelsBucket

  InstanceId:
    Description: EC2 instance ID (use with SSM for monitoring)
    Value: !Ref PrefetchInstance

  SsmShellCommand:
    Description: Command to open a shell on the instance via SSM
    Value: !Sub >-
      aws ssm start-session
      --target ${PrefetchInstance}
      --region ${AWS::Region}
